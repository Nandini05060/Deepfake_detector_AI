project:
  name: "LX-DFD"
  description: "Generalizable Deepfake Face Detection Using Spatial-Frequency Feature Learning"
  base_paper:
    authors: "Yogesh Patel, Sudeep Tanwar, Pronaya Bhattacharya, Rajesh Gupta, Turki Alsuwian, Innocent Ewean Davidson, and Thokozile F. Mazibuko"
    title: "An Improved Dense CNN Architecture for Deepfake Image Detection"
    journal: "IEEE Access, Volume 11, 2023, pp. 22081–22095"
    doi: "10.1109/ACCESS.2023.3251417"
    url: "https://ieeexplore.ieee.org/document/10057390/"
  research_gap: "Existing CNN-based deepfake detectors achieve high accuracy when trained and tested on known GAN-generated face datasets, but their ability to generalize to unseen generators, datasets, image transformations, and real-world conditions remains insufficiently investigated."

data:
  dataset_dir: "C:\\Users\\nandi\\.cache\\kagglehub\\datasets\\kshitizbhargava\\deepfake-face-images\\versions\\1\\Final Dataset"
  splits_dir: "data/splits_v2"
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  external_dir: "data/external"
  reports_audit_dir: "reports/dataset_audit"
  image_size: [224, 224]
  batch_size: 64
  num_workers: 0
  split_ratios:
    train: 0.70
    val: 0.15
    test: 0.15

augmentation:
  standard:
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    resized_crop_scale: [0.85, 1.0]
    color_jitter_p: 0.3
    brightness: 0.2
    contrast: 0.2
  robustness_v2:
    jpeg_compression_p: 0.35
    jpeg_quality_range: [60, 95]
    gaussian_blur_p: 0.25
    gaussian_blur_radius_range: [0.5, 1.5]
    gaussian_noise_p: 0.30
    gaussian_noise_std_range: [0.01, 0.04]
    horizontal_flip_p: 0.5
    rotation_degrees: 15
    resized_crop_scale: [0.85, 1.0]
    color_jitter_p: 0.3
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2

training:
  epochs: 15
  early_stopping_patience: 6
  learning_rate: 1.0e-4
  weight_decay: 1.0e-4
  optimizer: "AdamW"
  scheduler: "cosine"
  warmup_epochs: 2
  seed: 42
  use_amp: true

model:
  spatial_backbone: "efficientnet_b0"
  spatial_pretrained: true
  spatial_embed_dim: 256
  frequency_embed_dim: 256
  fusion_dim: 256
  dropout: 0.3
  spectral_dropout: false
  spectral_dropout_p: 0.2
  fusion_type: "attention"  # spatial_only, frequency_only, concat, weighted, attention

explainability:
  gradcam_target_layer: "features"
